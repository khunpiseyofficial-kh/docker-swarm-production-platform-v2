# ==============================================================================
# docker-stack.yml — Production-Like E-Commerce Platform on Docker Swarm (v2)
# ==============================================================================
# Deploy:
#   docker stack deploy -c stack/docker-stack.yml shop
#
# Prerequisite:
#   - Node labels applied:
#       docker node update --label-add ingress=true swarm-mgr01
#       docker node update --label-add ingress=true swarm-mgr02
#       docker node update --label-add storage=true swarm-worker03
#   - Secrets created (see stack/secrets.md)
#   - Configs created (see stack/configs.md)
# ==============================================================================

version: "3.8"

networks:
  frontend-net:
    driver: overlay
    attachable: false
    ipam:
      driver: default
      config:
        - subnet: 10.10.1.0/24

  backend-net:
    driver: overlay
    attachable: false
    ipam:
      driver: default
      config:
        - subnet: 10.10.2.0/24

volumes:
  mariadb-data:
    driver: local

secrets:
  db_root_password:
    external: true
  db_password:
    external: true
  jwt_secret:
    external: true
  tls_cert:
    external: true
  tls_key:
    external: true

configs:
  traefik_static_conf:
    external: true
  traefik_dynamic_conf:
    external: true
  mariadb_init_sql:
    external: true

services:
  # ----------------------------------------------------------------------------
  # 1. Traefik v3 Ingress Controller (2 Replicas / Routing Mesh)
  # ----------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    networks:
      - frontend-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: traefik_static_conf
        target: /etc/traefik/traefik.yml
      - source: traefik_dynamic_conf
        target: /etc/traefik/dynamic/dynamic.yml
    secrets:
      - source: tls_cert
        target: /run/secrets/tls_cert
      - source: tls_key
        target: /run/secrets/tls_key
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.ingress == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 15s

  # ----------------------------------------------------------------------------
  # 2. Frontend Web Service (React + Nginx Unprivileged)
  # ----------------------------------------------------------------------------
  frontend:
    image: registry01:5000/swarm-shop-frontend:v1.0.0
    networks:
      - frontend-net
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: pause
        monitor: 20s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=shop_frontend-net"
        - "traefik.http.routers.frontend.rule=Host(`shop.local`)"
        - "traefik.http.routers.frontend.entrypoints=websecure"
        - "traefik.http.routers.frontend.tls=true"
        - "traefik.http.routers.frontend.priority=10"
        - "traefik.http.services.frontend.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. Backend API Service (Node.js + Express)
  # ----------------------------------------------------------------------------
  backend:
    image: registry01:5000/swarm-shop-backend:v1.0.0
    networks:
      - frontend-net
      - backend-net
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=shopuser
      - DB_NAME=shopdb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    secrets:
      - db_password
      - jwt_secret
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: pause
        monitor: 25s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=shop_frontend-net"
        - "traefik.http.routers.backend.rule=Host(`shop.local`) && PathPrefix(`/api`)"
        - "traefik.http.routers.backend.entrypoints=websecure"
        - "traefik.http.routers.backend.tls=true"
        - "traefik.http.routers.backend.priority=100"
        - "traefik.http.services.backend.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1));\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 4. Redis In-Memory Cache (Append-Only Durability)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - backend-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 5. MariaDB Primary Storage (Pinned to worker03 storage node)
  # ----------------------------------------------------------------------------
  mariadb:
    image: mariadb:11.4
    networks:
      - backend-net
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - MYSQL_DATABASE=shopdb
      - MYSQL_USER=shopuser
    volumes:
      - mariadb-data:/var/lib/mysql
    configs:
      - source: mariadb_init_sql
        target: /docker-entrypoint-initdb.d/01-init.sql
    secrets:
      - db_root_password
      - db_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.storage == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 6. Node Exporter (Global Host-Level Metrics Collection)
  # ----------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)'
    ports:
      - target: 9100
        published: 9100
        protocol: tcp
        mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 5s
        order: stop-first       # Essential for host-mode port binding
        failure_action: rollback
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
  # ----------------------------------------------------------------------------
  # 7. cAdvisor (Global Container-Level Metrics Collection)
  # ----------------------------------------------------------------------------
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    command:
      - '--docker_only=true'
      - '--store_container_labels=false'
      - '--whitelisted_container_labels=com.docker.swarm.service.name,com.docker.swarm.task.name,com.docker.swarm.node.id'
      - '--housekeeping_interval=10s'
      - '--disable_metrics=advtcp,process'
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host       
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 5s
        order: stop-first       # Essential for host-mode port binding
        failure_action: rollback     
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M