# ==============================================================================
# nginx.conf — Hardened Nginx configuration for Docker Swarm Ingress & Dynamic DNS
# ==============================================================================
# Runs under nginxinc/nginx-unprivileged (UID 101, non-root)
# Listens on port 8080 (unprivileged port)
# ==============================================================================

pid /tmp/nginx.pid;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp paths for unprivileged user
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        # Explicit IPv4 bind on unprivileged port 8080
        # Resolves Gotcha #1: Alpine musl resolves localhost to ::1 (IPv6)
        listen 0.0.0.0:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Embedded Docker DNS Resolver with 10s TTL
        # Resolves Gotcha #2: Dynamic upstream resolution during rolling updates / restarts
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;

        # Internal container healthcheck endpoint
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Reverse proxy for API requests to Backend Swarm Service
        # Resolves Gotcha #3: Appending $request_uri explicitly when using a variable $upstream
        location /api/ {
            set $backend_upstream "http://backend:3000";
            
            # CRITICAL: Append $request_uri explicitly. 
            # In Nginx, proxy_pass with a variable URI DOES NOT perform path prefix rewriting!
            proxy_pass $backend_upstream$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Single Page Application (SPA) routing: fallback to index.html
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Static asset caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
