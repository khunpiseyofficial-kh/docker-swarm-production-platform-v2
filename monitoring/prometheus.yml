# ==============================================================================
# prometheus.yml — Global Cluster Scrape Configuration
# ==============================================================================
# Deployed on: monitoring01 (192.168.0.42)
# Scrapes:
#   - Node Exporter (:9100) across all 8 nodes (Swarm + Registry + Monitoring)
#   - cAdvisor (:8080) across Swarm nodes
#   - Traefik metrics (:80)
#
# Hot-reload enabled via: curl -X POST http://192.168.0.42:9090/-/reload
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # ----------------------------------------------------------------------------
  # 1. Host-Level Metrics: Node Exporter (All 8 Cluster Nodes)
  # ----------------------------------------------------------------------------
  - job_name: "node-exporter"
    static_configs:
      - targets: ["192.168.0.21:9100"]
        labels: { instance: "swarm-mgr01", environment: "lab-production" }
      - targets: ["192.168.0.22:9100"]
        labels: { instance: "swarm-mgr02", environment: "lab-production" }
      - targets: ["192.168.0.23:9100"]
        labels: { instance: "swarm-mgr03", environment: "lab-production" }
      - targets: ["192.168.0.31:9100"]
        labels: { instance: "swarm-worker01", environment: "lab-production" }
      - targets: ["192.168.0.32:9100"]
        labels: { instance: "swarm-worker02", environment: "lab-production" }
      - targets: ["192.168.0.33:9100"]
        labels: { instance: "swarm-worker03", environment: "lab-production" }
      - targets: ["192.168.0.41:9100"]
        labels: { instance: "registry01", environment: "lab-production" }
      - targets: ["node-exporter-monitoring01:9100"]
        labels: { instance: "monitoring01", environment: "lab-production" }

  # ----------------------------------------------------------------------------
  # 2. Container-Level Metrics: cAdvisor (Swarm Nodes)
  # ----------------------------------------------------------------------------
  - job_name: "cadvisor"
    static_configs:
      - targets: ["192.168.0.21:8080"]
        labels: { instance: "swarm-mgr01", environment: "lab-production" }
      - targets: ["192.168.0.22:8080"]
        labels: { instance: "swarm-mgr02", environment: "lab-production" }
      - targets: ["192.168.0.23:8080"]
        labels: { instance: "swarm-mgr03", environment: "lab-production" }
      - targets: ["192.168.0.31:8080"]
        labels: { instance: "swarm-worker01", environment: "lab-production" }
      - targets: ["192.168.0.32:8080"]
        labels: { instance: "swarm-worker02", environment: "lab-production" }
      - targets: ["192.168.0.33:8080"]
        labels: { instance: "swarm-worker03", environment: "lab-production" }

  # ----------------------------------------------------------------------------
  # 3. Prometheus Self-Monitoring
  # ----------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
